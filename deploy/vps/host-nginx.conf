# Bloco para o Nginx do servidor. Nao altera os sites ja existentes.
# O certbot --nginx acrescenta o listen 443 e o certificado.
server {
    listen 80;
    listen [::]:80;
    server_name operadorzero.com.br www.operadorzero.com.br;

    if ($host = www.operadorzero.com.br) {
        return 301 https://operadorzero.com.br$request_uri;
    }

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
