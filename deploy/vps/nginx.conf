# Nginx interno do Operador Zero: serve a SPA e encaminha /api para a API no mesmo dominio.
# Fica atras do proxy do servidor (Nginx, Caddy ou Traefik), que termina o HTTPS.

# O proxy do servidor envia o IP real em X-Real-IP; o rate limit da API depende dele.
map $http_x_real_ip $oz_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

map $http_x_forwarded_proto $oz_forwarded_proto {
    ""      https;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 3m;

    # add_header de um location substitui os do server, por isso cada bloco inclui os cabecalhos.
    include /etc/nginx/snippets/security-headers.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $oz_client_ip;
    proxy_set_header X-Forwarded-Proto $oz_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://api:8080;
    }

    # Envio de midia em pedacos de 8 MB, repassado sem bufferizar em disco.
    location /api/media/uploads/ {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://api:8080;
    }

    # Midias do feed: caminhos aleatorios e imutaveis, servidas direto do volume.
    location /media/ {
        alias /srv/media/public/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            image/webp webp;
        }
        default_type application/octet-stream;
        autoindex off;
        try_files $uri =404;
    }

    # Link compartilhado de post: a API devolve o HTML com a previa (WhatsApp nao executa o app).
    location /p/ {
        proxy_pass http://api:8080;
    }

    # Login com Google: inicio liberado pela API e retorno (callback) do Google.
    location = /oauth2/authorization/google {
        proxy_pass http://api:8080;
    }

    location = /login/oauth2/code/google {
        proxy_pass http://api:8080;
    }

    # Somente as sondas publicas; metricas e demais endpoints do actuator nao saem do servidor.
    location ~ ^/actuator/health(/liveness|/readiness)?$ {
        proxy_pass http://api:8080;
    }

    location /actuator/ {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
