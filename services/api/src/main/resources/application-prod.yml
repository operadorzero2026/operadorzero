spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true
  data:
    redis:
      url: ${REDIS_URL}
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
app:
  auth:
    cookie:
      secure: true
      same-site: None
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
