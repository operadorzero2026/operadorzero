spring:
  config:
    activate:
      on-profile: prod
  flyway:
    clean-disabled: true
  data:
    redis:
      url: ${REDIS_URL}
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
server:
  shutdown: graceful
app:
  auth:
    cookie:
      secure: true
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
