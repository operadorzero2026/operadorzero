spring:
  application:
    name: operador-zero-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/operador_zero}
    username: ${DATABASE_USER:operador_zero}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: ${DATABASE_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  swagger-ui:
    enabled: ${OPENAPI_UI_ENABLED:true}
logging:
  level:
    root: INFO
    br.com.operadorzero: INFO
