spring:
  application:
    name: operador-zero-api
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/operador_zero}
    username: ${DATABASE_USER:operador_zero}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: ${DATABASE_POOL_MIN:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
springdoc:
  swagger-ui:
    enabled: ${OPENAPI_UI_ENABLED:true}
logging:
  level:
    root: INFO
    br.com.operadorzero: INFO
app:
  auth:
    enabled: ${AUTH_ENABLED:false}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4174}
    issuer-name: ${AUTH_ISSUER_NAME:Operador Zero}
    hash-key: ${AUTH_HASH_KEY:}
    session-duration: ${AUTH_SESSION_DURATION:7d}
    token-duration: ${AUTH_TOKEN_DURATION:30m}
    cookie:
      name: ${AUTH_COOKIE_NAME:OZ_SESSION}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_COOKIE_DOMAIN:}
    mail:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@operadorzero.local}
      resend:
        api-key: ${RESEND_API_KEY:}
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4174,http://127.0.0.1:4174}
