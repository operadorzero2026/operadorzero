previews:
  generation: off

services:
  - type: web
    name: operadorzero-api-staging
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/operadorzero2026/operadorzero
    branch: deploy/render-vercel
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: operadorzero-postgres-staging
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: operadorzero-postgres-staging
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: operadorzero-postgres-staging
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: operadorzero-redis-staging
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_POOL_MIN
        value: "1"
      - key: OPENAPI_UI_ENABLED
        value: "false"

  - type: keyvalue
    name: operadorzero-redis-staging
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: operadorzero-postgres-staging
    databaseName: operadorzero
    user: operadorzero
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
