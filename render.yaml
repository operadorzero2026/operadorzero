previews:
  generation: off

services:
  - type: web
    name: operadorzero-api-staging
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/operadorzero2026/operadorzero
    branch: deploy/render-vercel
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: operadorzero-postgres-staging
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: operadorzero-postgres-staging
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: operadorzero-postgres-staging
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: operadorzero-redis-staging
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_POOL_MIN
        value: "1"
      - key: OPENAPI_UI_ENABLED
        value: "false"
      - key: AUTH_ENABLED
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None
      - key: MAIL_ENABLED
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        sync: false
      - key: MAIL_STARTTLS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_AUTH_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: operadorzero-redis-staging
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: operadorzero-postgres-staging
    databaseName: operadorzero
    user: operadorzero
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
