name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - deploy/render-vercel

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - working-directory: services/api
        run: mvn -B clean verify
      - run: docker build --tag operadorzero-api:ci services/api

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate YAML and JSON syntax
        run: npm ci && npm run validate:deploy

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history with Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git --redact --exit-code=1 /repo
